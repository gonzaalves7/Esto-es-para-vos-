<!DOCTYPE html>
<html>
 <head>
        <title>Esto es para vos 🌻</title>

       <style>

              body {
                     margin: 0;
                     min-height: 100vh;
                     display: flex;
                     justify-content: center;
                     align-items: center;
                     background: #fff8dc;
              }


              h1 {
                     front-size: 42px;
                     color: #6b4f20;
                     text-align: center;
                     margin-bottom: 200px;
              }


              .escena {
                     text-align: center;
                     width: 320px;
                     position: relative;
              }


              .tallo {
                     width: 8px;
                     height: 180px;
                     background: #4f7d32;
                     margin: 0 auto;
              }


              .hoja {
                     width: 55px;
                     height: 25px;
                     background: #4f7d32;
                     border-radius: 100% 0;
                     position: absolute;
                     top: 90px;
              }


              .izquierda {
                     left: -21px;
                     top: 125px;
                     transform: rotate(-25deg);
              }


              .derecha {
                     right: -21px;
                     top: 150px;
                     transform: rotate(25deg) scaleX(-1);
              }


              .cabeza {
                     width: 60px;
                     height: 60px;
                     background: #f5c400;
                     border-radius: 50%;
                     margin: 0 auto 0;
                     position: relative;
              }


              .petalo {
                     width: 20px;
                     height: 45px;
                     background: #f5c400;
                     border-radius: 50%;
                     position: absolute;
                     top: -25px;
                     left: 19px;
                     display: block;
                     transform-origin: 11px 55px;
              }


              .cabeza .petalo:nth-child(1) {
                     transform: rotate(-45deg);
              }


              .cabeza .petalo:nth-child(2) {
                     transform: rotate(45deg);
              }


              .cabeza .petalo:nth-child(3) {
                     transform: rotate(90deg);
              }


              .cabeza .petalo:nth-child(4) {
                     transform: rotate(135deg);
              }


              .cabeza .petalo:nth-child(5) {
                     transform: rotate(180deg);
              }


              .cabeza .petalo:nth-child(6) {
                     transform: rotate(225deg);
              }


              .cabeza .petalo:nth-child(7) {
                     transform: rotate(270deg);
              }


              .cabeza .petalo:nth-child(8) {
                     transform: rotate(315);
              }


              .cabeza::after {
                     content: "";
                     width: 32px;
                     height: 32px;
                     background: #4a2b16;
                     border-radius: 50%;
                     position: absolute;
                     top: 14px;
                     left: 14px;
                     z-index: 3;
              }


              .cabeza::before {
                     content: "";
                     width: 2px;
                     height: 2px;
                     background: #24150c;
                     border-radius: 50%;
                     position: absolute;
                     top: 20px;
                     left: 20px;
                     z-index: 5;

                     box-shadow:
                     8px 2px #24150c,
                     15px 5px #24150c,
                     4px 10px #24150c,
                     12px 14px #24150c,
                     1px 17px #24150c,
                     17px 15px #24150c;
              }


              /*
               * JARDÍN FIJO
               */

              .jardin {
                     width: 320px;
                     height: 210px;
                     position: relative;
                     margin: 0 auto;
              }


              /*
               * FLORES
               */

              .flores {
                     display: flex;
                     justify-content: center;
                     align-items: flex-end;
                     gap: 20px;

                     width: 320px;
                     height: 185px;

                     position: absolute;
                     left: 0;
                     top: 0;

                     visibility: hidden;
              }


              .flores.mostrar {
                     visibility: visible;
              }


              .flor-wrap {
                     display: flex;
                     align-items: flex-end;

                     /*
                      * El balanceo ocurre en el contenedor,
                      * no en la flor.
                      */
                     transform-origin: bottom center;
              }


              /*
               * CRECIMIENTO DE LAS FLORES
               */

              .flor {
                     position: relative;
                     transform-origin: bottom center;
                     transform: scale(0);
              }


              .flor.crecer {
                     animation: crecer 2s ease-out forwards;
              }


              @keyframes crecer {

                     from {
                            transform: scale(0);
                     }

                     to {
                            transform: scale(1);
                     }

              }


              /*
               * BALANCEO
               *
               * Como está aplicado al .flor-wrap,
               * no modifica el crecimiento de la flor.
               */

              .flor-wrap.balancear {
                     animation: balance 3s ease-in-out 2s infinite;
              }


              @keyframes balance {

                     0%, 100% {
                            transform: rotate(-6deg);
                     }

                     50% {
                            transform: rotate(6deg);
                     }

              }


              /*
               * FLOR CENTRAL MÁS GRANDE
               */

              .grande .flor.crecer {
                     animation: crecerGrande 2s ease-out forwards;
              }


              @keyframes crecerGrande {

                     from {
                            transform: scale(0);
                     }

                     to {
                            transform: scale(1.15);
                     }

              }


              /*
               * SUELO FIJO
               */

              .suelo {
                     width: 320px;
                     height: 25px;
                     background: #6b8e3d;
                     border-radius: 50%;

                     position: absolute;
                     left: 0;
                     top: 180px;

                     visibility: hidden;
              }


              .suelo.mostrar {
                     visibility: visible;
              }


              /*
               * BIENVENIDA
               */

              #bienvenida {
                     color: #6b4f20;
                     text-align: center;

                     position: absolute;
                     width: 100vw;
                     left: 50%;
                     transform: translateX(-50%);
                     top: -150px;
              }


              #bienvenida h1 {
                     margin-bottom: 20px;
              }


              #bienvenida p {
                     font-size: 18px;
                     color: #6b4f20;
              }


              /*
               * MENSAJE
               */

              #mensaje {
                     opacity: 0;
                     color: #6b4f20;
                     font-size: 24px;
                     margin-top: 20px;
                     transition: opacity 0.5s ease;
              }


              /*
               * FLORECITAS QUE APARECEN
               * AL SEGUIR HACIENDO CLICK
               */

              .flor-flotante {
                     position: fixed;
                     font-size: 30px;
                     pointer-events: none;
                     animation: aparecerFlor 0.5s ease-out;
                     z-index: 10;
              }


              @keyframes aparecerFlor {

                     from {
                            opacity: 0;
                            transform: scale(0);
                     }

                     to {
                            opacity: 1;
                            transform: scale(1);
                     }

              }

       </style>
 </head>


 <body>

       <div class="escena">


              <div id="bienvenida">

                     <h1>Hola hice esto para vos</h1>

                     <p>Hacé click je</p>

              </div>


              <div class="jardin">


                     <div class="flores">


                            <!-- FLOR IZQUIERDA -->

                            <div class="flor-wrap">

                                   <div class="flor">

                                          <div class="cabeza">

                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>

                                          </div>


                                          <div class="tallo">

                                                 <div class="hoja izquierda"></div>
                                                 <div class="hoja derecha"></div>

                                          </div>

                                   </div>

                            </div>


                            <!-- FLOR CENTRAL -->

                            <div class="flor-wrap grande">

                                   <div class="flor">

                                          <div class="cabeza">

                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>

                                          </div>


                                          <div class="tallo">

                                                 <div class="hoja izquierda"></div>
                                                 <div class="hoja derecha"></div>

                                          </div>

                                   </div>

                            </div>


                            <!-- FLOR DERECHA -->

                            <div class="flor-wrap">

                                   <div class="flor">

                                          <div class="cabeza">

                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>
                                                 <div class="petalo"></div>

                                          </div>


                                          <div class="tallo">

                                                 <div class="hoja izquierda"></div>
                                                 <div class="hoja derecha"></div>

                                          </div>

                                   </div>

                            </div>


                     </div>


                     <div class="suelo"></div>


              </div>


              <p id="mensaje"></p>


       </div>


       <script>

              const flores =
                     document.querySelector(".flores");


              const suelo =
                     document.querySelector(".suelo");


              const bienvenida =
                     document.getElementById("bienvenida");


              const floresIndividuales =
                     document.querySelectorAll(".flor");


              const mensajes =
                     document.getElementById("mensaje");


              const wrappers =
                     document.querySelectorAll(".flor-wrap");


              let primerToque = true;


              document.body.addEventListener("click", () => {


                     if (primerToque) {


                            /*
                             * Desaparece la bienvenida
                             */

                            bienvenida.style.display = "none";


                            /*
                             * Aparecen las flores y el suelo
                             */

                            flores.classList.add("mostrar");

                            suelo.classList.add("mostrar");


                            /*
                             * Las flores empiezan a crecer
                             */

                            floresIndividuales.forEach(flor => {

                                   flor.classList.add("crecer");

                            });


                            /*
                             * Una vez que empiezan a crecer,
                             * los tallos comienzan a balancearse.
                             *
                             * El delay de 2 segundos hace que
                             * primero termine el crecimiento.
                             */

                            wrappers.forEach(flor => {

                                   flor.classList.add("balancear");

                            });


                            /*
                             * Aparece el mensaje
                             */

                            setTimeout(() => {

                                   mensajes.textContent =
                                          "Queria que tuvieras tus flores hoy asi que tuve que improvisar <33 no es mucho pero si lo hice con mucho amor je, espero que te guste me llevo mas de 4 horas jadjsakba mira si seguis clickeando salen mas florcitas yeii🌻";

                                   mensajes.style.opacity = "1";

                            }, 1200);


                            primerToque = false;


                     } else {


                            crearFlor();

                     }

              });


              function crearFlor() {

                     const flor =
                            document.createElement("div");


                     flor.textContent = "🌻";


                     flor.classList.add("flor-flotante");


                     flor.style.left =
                            Math.random() * 90 + "%";


                     flor.style.top =
                            Math.random() * 85 + "%";


                     document.body.appendChild(flor);

              }

       </script>

 </body>
</html>
